[tox]
envlist =
    py{310,311,312,313}-test{,-dev,-casa,-cov}
    build_docs
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
    tox-uv
    mock
isolated_build = true
indexserver =
    NRAO = https://casa-pip.nrao.edu/repository/pypi-group/simple

[testenv]
passenv =
    HOME
    DISPLAY
    LC_ALL
    LC_CTYPE
    ON_TRAVIS
    CASASITECONFIG
setenv =
    # Install nightly builds with uv (see radio-astro-tools/spectral-cube#994)
    dev: UV_INDEX = https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
    dev: UV_INDEX_STRATEGY = unsafe-best-match
    dev: UV_PRERELEASE = allow
changedir =
    .tmp/{envname}
description =
    run tests with pytest
deps =
    mock
    dev: numpy>=0.0.dev0
    dev: pyerfa>=0.0.dev0
    dev: astropy>=0.0.dev0
    dev: reproject>=0.0.dev0
    dev: spectral-cube @ git+https://github.com/radio-astro-tools/spectral-cube
    dev: radio-beam @ git+https://github.com/radio-astro-tools/radio-beam
    casa: casatools>=6.4
    casa: casatasks>=6.4
    casa: casadata

extras =
    test
    all: all
commands =
    casa: mkdir -p .casa/data
    casa: cp {toxinidir}/config_template.py config.py
    casa: python -m casaconfig --update-all
    casa: python -m casaconfig --current-data
    {list_dependencies_command}
    !cov: pytest --pyargs uvcombine {toxinidir}/docs {posargs}
    cov: pytest --pyargs uvcombine {toxinidir}/docs --cov uvcombine --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml
allowlist_externals =
    mkdir
    cp

[testenv:build_docs]
changedir =
    docs
description =
    invoke sphinx-build to build the HTML docs
extras =
    docs
commands =
    sphinx-build -W -b html . _build/html {posargs}

[testenv:codestyle]
deps = flake8
skip_install = true
commands =
    flake8 --max-line-length=100 uvcombine
